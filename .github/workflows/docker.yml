name: Docker

# release 正式发布后才构建镜像：复用该 release 的 kxen CLI 资产，镜像内容与发布产物同源。
# 主 Release workflow 直接调用本 workflow，避免 GITHUB_TOKEN 创建 release 时不触发 release event。
# workflow_dispatch 只用于为已发布版本补发。
on:
  workflow_call:
    inputs:
      tag:
        description: 已发布的 release tag
        required: true
        type: string
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 已发布的 release tag（如 v0.1.2）
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  image:
    name: Build and push GHCR image
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Resolve immutable release source
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { printf 'invalid tag: %s\n' "$tag" >&2; exit 1; }
          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag")"
          jq -e --arg tag "$tag" '
            .tag_name == $tag and
            .draft == false and
            .prerelease == false and
            .immutable == true and
            (.published_at | type == "string" and length > 0) and
            (.target_commitish | type == "string" and length > 0)
          ' <<< "$release_json" > /dev/null
          target="$(jq -r .target_commitish <<< "$release_json")"
          tag_commit="$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)"
          target_commit="$(gh api "repos/$GITHUB_REPOSITORY/commits/$target" --jq .sha)"
          [[ "$tag_commit" == "$target_commit" ]] || {
            printf 'release target %s (%s) does not match tag %s (%s)\n' \
              "$target" "$target_commit" "$tag" "$tag_commit" >&2
            exit 1
          }
          # GHCR 仓库路径必须全小写，github.repository 可能含大写 owner
          printf 'tag=%s\nversion=%s\ncommit=%s\nimage=ghcr.io/%s\n' \
            "$tag" "${tag#v}" "$tag_commit" \
            "$(printf '%s' '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.tag.outputs.commit }}
          persist-credentials: false

      - name: Fetch kxen CLI assets from release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p context
          gh release download "$TAG" --pattern 'kxen-linux-x86_64.tar.gz' --pattern 'kxen-linux-aarch64.tar.gz' --pattern 'SHA256SUMS' --dir context --clobber
          # 镜像内容以 release 资产为准，构建前用随包 SHA256SUMS 复核两个 tar.gz；
          # 清单还覆盖未下载的其他资产，只取本镜像消费的两条，缺一条即失败。
          grep -E '  kxen-linux-(x86_64|aarch64)\.tar\.gz$' context/SHA256SUMS > context/SHA256SUMS.docker
          test "$(wc -l < context/SHA256SUMS.docker)" -eq 2
          (cd context && sha256sum -c SHA256SUMS.docker)
          tar -xzf context/kxen-linux-x86_64.tar.gz -C context
          mv context/kxen context/kxen-amd64
          tar -xzf context/kxen-linux-aarch64.tar.gz -C context
          mv context/kxen context/kxen-arm64
          rm context/*.tar.gz context/SHA256SUMS context/SHA256SUMS.docker
          test -x context/kxen-amd64 && test -x context/kxen-arm64
          cp Dockerfile context/

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: context
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.tag.outputs.image }}:latest
            ${{ steps.tag.outputs.image }}:${{ steps.tag.outputs.version }}
            ${{ steps.tag.outputs.image }}:${{ steps.tag.outputs.tag }}

      - name: Verify published manifest
        run: |
          docker buildx imagetools inspect "${{ steps.tag.outputs.image }}:${{ steps.tag.outputs.tag }}" \
            | grep -E 'linux/amd64|linux/arm64'
