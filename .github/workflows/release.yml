name: Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release
        required: true
        default: v0.1.0

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  macos:
    name: macOS ARM64
    runs-on: macos-14
    timeout-minutes: 90
    environment: release
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: pnpm/action-setup@v6
        with:
          version: 11.15.1
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - run: pnpm install --frozen-lockfile
      - name: Validate release credentials
        shell: bash
        run: |
          set -euo pipefail
          KXEN_VERSION="$(jq -r '.version' src-tauri/tauri.conf.json)"
          if [[ "$RELEASE_TAG" != "v$KXEN_VERSION" ]]; then
            printf 'release tag %s does not match v%s\n' "$RELEASE_TAG" "$KXEN_VERSION"
            exit 1
          fi
          required=(
            APPLE_CERTIFICATE
            APPLE_CERTIFICATE_PASSWORD
            APPLE_TEAM_ID
            APPLE_API_ISSUER
            APPLE_API_KEY
            APPLE_API_PRIVATE_KEY
            TAURI_SIGNING_PRIVATE_KEY
            TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then
              printf 'missing release secret: %s\n' "$name"
              exit 1
            fi
          done
      - name: Import Developer ID certificate
        shell: bash
        run: |
          set -euo pipefail
          KXEN_KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          KXEN_KEYCHAIN_PATH="$RUNNER_TEMP/kxen-signing.keychain-db"
          KXEN_CERTIFICATE_PATH="$RUNNER_TEMP/kxen-certificate.p12"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$KXEN_CERTIFICATE_PATH"
          security create-keychain -p "$KXEN_KEYCHAIN_PASSWORD" "$KXEN_KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KXEN_KEYCHAIN_PATH"
          security unlock-keychain -p "$KXEN_KEYCHAIN_PASSWORD" "$KXEN_KEYCHAIN_PATH"
          security import "$KXEN_CERTIFICATE_PATH" \
            -k "$KXEN_KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security list-keychain -d user -s "$KXEN_KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KXEN_KEYCHAIN_PASSWORD" \
            "$KXEN_KEYCHAIN_PATH"
          KXEN_SIGNING_IDENTITY="$(
            security find-identity -v -p codesigning "$KXEN_KEYCHAIN_PATH" |
              awk -F '"' '/Developer ID Application/ { print $2; exit }'
          )"
          if [[ -z "$KXEN_SIGNING_IDENTITY" ]]; then
            printf 'Developer ID Application identity not found\n'
            exit 1
          fi
          printf 'APPLE_SIGNING_IDENTITY=%s\n' "$KXEN_SIGNING_IDENTITY" >> "$GITHUB_ENV"
      - name: Prepare App Store Connect key
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          KXEN_API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$KXEN_API_KEY_PATH"
          printf 'APPLE_API_KEY_PATH=%s\n' "$KXEN_API_KEY_PATH" >> "$GITHUB_ENV"
      - name: Build and publish GitHub release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tagName: v__VERSION__
          releaseName: Kxen v__VERSION__ development preview
          releaseBody: macOS 14+ Apple Silicon signed and notarized build.
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          args: --target aarch64-apple-darwin
