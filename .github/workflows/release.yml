---
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable SemVer tag to release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release source
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # workflow_dispatch 必须从 main 运行，校验器与 workflow 固定在同一 commit。
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate exact tag, main, workflow, and product metadata parity
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          source scripts/release-lib.sh
          kxen_require_release_tag "$RELEASE_TAG"
          mkdir -p "$RUNNER_TEMP/release-tools"
          cp scripts/release-lib.sh scripts/release-manifest.sh scripts/validate-release.sh \
            "$RUNNER_TEMP/release-tools/"
          cp cliff.toml "$RUNNER_TEMP/release-tools/cliff.toml"
          if ! git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            printf 'release tag does not exist locally: %s\n' "$RELEASE_TAG"
            exit 1
          fi
          release_revision="${RELEASE_TAG}^{commit}"
          release_commit="$(git rev-parse --verify "$release_revision")"
          main_commit="$(git rev-parse --verify 'origin/main^{commit}')"
          workflow_commit="$(git rev-parse --verify "$GITHUB_SHA^{commit}")"
          kxen_require_release_source_parity \
            "$RELEASE_TAG" "$release_commit" origin/main "$main_commit" \
            workflow "$workflow_commit"
          kxen_require_successful_main_ci "$GITHUB_REPOSITORY" "$release_commit"
          git checkout --detach "$release_commit"
          bash "$RUNNER_TEMP/release-tools/validate-release.sh" \
            "$RELEASE_TAG" origin/main "$GITHUB_REPOSITORY" "$GITHUB_SHA"
      - name: Generate release notes before platform builds
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          version: v2.13.1
          config: ${{ runner.temp }}/release-tools/cliff.toml
          args: --current --strip header --output ${{ runner.temp }}/release-notes.md
      - name: Validate release notes before platform builds
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/release-tools/release-lib.sh"
          kxen_validate_release_notes_file "$RELEASE_TAG" "$RUNNER_TEMP/release-notes.md"

  matrix:
    name: Release platform matrix
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # 矩阵单一出处是 main 上的 release-manifest.sh，与可信工具同规则固定。
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Derive build matrix from release manifest
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          matrix_json="$(bash scripts/release-manifest.sh json | jq -c .)"
          printf 'matrix=%s\n' "$matrix_json" >> "$GITHUB_OUTPUT"

  desktop:
    name: Build ${{ matrix.platform }} desktop assets
    needs:
      - validate
      - matrix
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    environment: release
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Preserve trusted release tools
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/trusted-release-tools"
          cp scripts/{github-release,prepare-release-assets,release-lib,release-manifest,validate-release,verify-macos-release,verify-release-assets}.sh \
            scripts/verify-updater-signature.mjs \
            "$RUNNER_TEMP/trusted-release-tools/"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.15.1
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: matrix.platform == 'macos-x86_64' || startsWith(matrix.platform, 'windows-')
        with:
          key: release-desktop-${{ matrix.target }}
          cache-bin: "false"
      # tauri/webkit 系统依赖（tray-icon 需要 libayatana-appindicator），与 ci.yml 清单一致：仅 Linux
      # xdg-utils：deb/AppImage bundler 调用 xdg-open（arm64 runner 镜像不自带，amd64 自带所以历史上没暴露）
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev xdg-utils
      - run: pnpm install --frozen-lockfile
      - name: Validate signing credentials
        if: matrix.signed
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          required=(
            APPLE_CERTIFICATE
            APPLE_CERTIFICATE_PASSWORD
            APPLE_TEAM_ID
            APPLE_API_ISSUER
            APPLE_API_KEY
            APPLE_API_PRIVATE_KEY
            TAURI_SIGNING_PRIVATE_KEY
            TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then
              printf 'missing release secret: %s\n' "$name"
              exit 1
            fi
          done
          if [[ ! "$APPLE_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]]; then
            printf 'APPLE_TEAM_ID must contain 10 uppercase letters or digits\n'
            exit 1
          fi
          if [[ ! "$APPLE_API_KEY" =~ ^[A-Z0-9]{10}$ ]]; then
            printf 'APPLE_API_KEY must contain 10 uppercase letters or digits\n'
            exit 1
          fi
          if [[ ! "$APPLE_API_ISSUER" =~ ^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$ ]]; then
            printf 'APPLE_API_ISSUER must be a UUID\n'
            exit 1
          fi
      - name: Validate updater signing credentials
        if: ${{ !matrix.signed }}
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              printf 'missing release secret: %s\n' "$name"
              exit 1
            fi
          done
      - name: Import Developer ID certificate
        if: matrix.signed
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          umask 077
          KXEN_KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          KXEN_KEYCHAIN_PATH="$RUNNER_TEMP/kxen-signing.keychain-db"
          KXEN_CERTIFICATE_PATH="$RUNNER_TEMP/kxen-certificate.p12"
          printf '%s' "$APPLE_CERTIFICATE" | base64 -D > "$KXEN_CERTIFICATE_PATH"
          security create-keychain -p "$KXEN_KEYCHAIN_PASSWORD" "$KXEN_KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KXEN_KEYCHAIN_PATH"
          security unlock-keychain -p "$KXEN_KEYCHAIN_PASSWORD" "$KXEN_KEYCHAIN_PATH"
          security import "$KXEN_CERTIFICATE_PATH" \
            -k "$KXEN_KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security list-keychain -d user -s "$KXEN_KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KXEN_KEYCHAIN_PASSWORD" \
            "$KXEN_KEYCHAIN_PATH"
          KXEN_SIGNING_IDENTITY_LINES="$(
            security find-identity -v -p codesigning "$KXEN_KEYCHAIN_PATH" |
              awk '/Developer ID Application/'
          )"
          KXEN_SIGNING_IDENTITY_COUNT="$(printf '%s\n' "$KXEN_SIGNING_IDENTITY_LINES" | awk 'NF { count += 1 } END { print count + 0 }')"
          if [[ "$KXEN_SIGNING_IDENTITY_COUNT" != 1 ]]; then
            printf 'expected exactly one Developer ID Application identity, found %s\n' "$KXEN_SIGNING_IDENTITY_COUNT"
            exit 1
          fi
          if [[ "$KXEN_SIGNING_IDENTITY_LINES" != *"($APPLE_TEAM_ID)"* ]]; then
            printf 'Developer ID Application identity does not match APPLE_TEAM_ID\n'
            exit 1
          fi
          KXEN_SIGNING_IDENTITY="$(awk '{ print $2 }' <<< "$KXEN_SIGNING_IDENTITY_LINES")"
          if [[ ! "$KXEN_SIGNING_IDENTITY" =~ ^[0-9A-F]{40}$ ]]; then
            printf 'Developer ID Application identity does not expose one SHA-1 hash\n'
            exit 1
          fi
          printf 'APPLE_SIGNING_IDENTITY=%s\n' "$KXEN_SIGNING_IDENTITY" >> "$GITHUB_ENV"
      - name: Prepare App Store Connect key
        if: matrix.signed
        shell: bash
        env:
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          KXEN_API_KEY_PATH="$RUNNER_TEMP/app-store-connect.p8"
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$KXEN_API_KEY_PATH"
          printf 'APPLE_API_KEY_PATH=%s\n' "$KXEN_API_KEY_PATH" >> "$GITHUB_ENV"
      - name: Build, sign, notarize, and staple
        if: matrix.signed
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --target ${{ matrix.target }}
      # 无 OS 级签名的平台仍注入 Tauri updater minisign 私钥,产出 updater .sig。
      - name: Build unsigned bundles with updater signatures
        if: ${{ !matrix.signed }}
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --target ${{ matrix.target }}
      - name: Notarize and staple DMG
        if: matrix.signed
        shell: bash
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          set -euo pipefail
          dmg_path="$(find "target/${{ matrix.target }}/release/bundle/dmg" -maxdepth 1 -name 'Kxen_*.dmg' | head -1)"
          if [[ -z "$dmg_path" ]]; then
            printf 'DMG bundle not found\n'
            exit 1
          fi
          # Tauri 只公证 .app;DMG 容器必须通过 Gatekeeper primary-signature 评估,
          # 需要单独提交公证并 staple ticket(verify-macos-release.sh 的硬性检查)。
          xcrun notarytool submit "$dmg_path" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "$dmg_path"
      - name: Verify signed app, DMG, and updater artifacts
        if: matrix.signed
        shell: bash
        run: >-
          bash "$RUNNER_TEMP/trusted-release-tools/verify-macos-release.sh"
          "target/${{ matrix.target }}/release/bundle"
      - name: Clear temporary signing material
        if: ${{ always() && matrix.signed }}
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/kxen-signing.keychain-db" 2>/dev/null || true
          for path in "$RUNNER_TEMP/kxen-certificate.p12" "$RUNNER_TEMP/app-store-connect.p8"; do
            if [[ -f "$path" ]]; then
              : > "$path"
              chmod 000 "$path"
            fi
          done
      - name: Prepare verified desktop asset set
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: >-
          bash "$RUNNER_TEMP/trusted-release-tools/prepare-release-assets.sh"
          "${{ matrix.platform }}"
          "$RELEASE_TAG"
          "$GITHUB_REPOSITORY"
          "target/${{ matrix.target }}/release/bundle"
          "$RUNNER_TEMP/release-assets"
          desktop
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-desktop-${{ matrix.platform }}-${{ needs.validate.outputs.tag }}
          path: ${{ runner.temp }}/release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  headless:
    name: Build ${{ matrix.platform }} headless assets
    needs:
      - validate
      - matrix
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    environment: release
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Preserve trusted release tools
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/trusted-release-tools"
          cp scripts/{github-release,prepare-release-assets,release-lib,release-manifest,validate-release,verify-macos-release,verify-release-assets}.sh \
            scripts/verify-updater-signature.mjs \
            "$RUNNER_TEMP/trusted-release-tools/"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.15.1
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: matrix.platform == 'macos-x86_64' || startsWith(matrix.platform, 'windows-')
        with:
          key: release-headless-${{ matrix.target }}
          cache-bin: "false"
      - run: pnpm install --frozen-lockfile
      - name: Build frontend dist for rust-embed
        run: pnpm build
      - name: Validate macOS CLI signing credentials
        if: matrix.signed
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          required=(
            APPLE_CERTIFICATE
            APPLE_CERTIFICATE_PASSWORD
            APPLE_TEAM_ID
            APPLE_API_ISSUER
            APPLE_API_KEY
            APPLE_API_PRIVATE_KEY
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then
              printf 'missing release secret: %s\n' "$name"
              exit 1
            fi
          done
          if [[ ! "$APPLE_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]]; then
            printf 'APPLE_TEAM_ID must contain 10 uppercase letters or digits\n'
            exit 1
          fi
          if [[ ! "$APPLE_API_KEY" =~ ^[A-Z0-9]{10}$ ]]; then
            printf 'APPLE_API_KEY must contain 10 uppercase letters or digits\n'
            exit 1
          fi
          if [[ ! "$APPLE_API_ISSUER" =~ ^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$ ]]; then
            printf 'APPLE_API_ISSUER must be a UUID\n'
            exit 1
          fi
      - name: Import Developer ID certificate
        if: matrix.signed
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          umask 077
          KXEN_KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          KXEN_KEYCHAIN_PATH="$RUNNER_TEMP/kxen-signing.keychain-db"
          KXEN_CERTIFICATE_PATH="$RUNNER_TEMP/kxen-certificate.p12"
          printf '%s' "$APPLE_CERTIFICATE" | base64 -D > "$KXEN_CERTIFICATE_PATH"
          security create-keychain -p "$KXEN_KEYCHAIN_PASSWORD" "$KXEN_KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KXEN_KEYCHAIN_PATH"
          security unlock-keychain -p "$KXEN_KEYCHAIN_PASSWORD" "$KXEN_KEYCHAIN_PATH"
          security import "$KXEN_CERTIFICATE_PATH" \
            -k "$KXEN_KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security list-keychain -d user -s "$KXEN_KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KXEN_KEYCHAIN_PASSWORD" \
            "$KXEN_KEYCHAIN_PATH"
          KXEN_SIGNING_IDENTITY_LINES="$(
            security find-identity -v -p codesigning "$KXEN_KEYCHAIN_PATH" |
              awk '/Developer ID Application/'
          )"
          KXEN_SIGNING_IDENTITY_COUNT="$(printf '%s\n' "$KXEN_SIGNING_IDENTITY_LINES" | awk 'NF { count += 1 } END { print count + 0 }')"
          if [[ "$KXEN_SIGNING_IDENTITY_COUNT" != 1 ]]; then
            printf 'expected exactly one Developer ID Application identity, found %s\n' "$KXEN_SIGNING_IDENTITY_COUNT"
            exit 1
          fi
          if [[ "$KXEN_SIGNING_IDENTITY_LINES" != *"($APPLE_TEAM_ID)"* ]]; then
            printf 'Developer ID Application identity does not match APPLE_TEAM_ID\n'
            exit 1
          fi
          KXEN_SIGNING_IDENTITY="$(awk '{ print $2 }' <<< "$KXEN_SIGNING_IDENTITY_LINES")"
          if [[ ! "$KXEN_SIGNING_IDENTITY" =~ ^[0-9A-F]{40}$ ]]; then
            printf 'Developer ID Application identity does not expose one SHA-1 hash\n'
            exit 1
          fi
          printf 'APPLE_SIGNING_IDENTITY=%s\n' "$KXEN_SIGNING_IDENTITY" >> "$GITHUB_ENV"
      - name: Prepare App Store Connect key
        if: matrix.signed
        shell: bash
        env:
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          KXEN_API_KEY_PATH="$RUNNER_TEMP/app-store-connect.p8"
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$KXEN_API_KEY_PATH"
          printf 'APPLE_API_KEY_PATH=%s\n' "$KXEN_API_KEY_PATH" >> "$GITHUB_ENV"
      - name: Build kxen headless server and agent CLI
        shell: bash
        run: >-
          cargo build --release
          -p kxen-cli -p kxen-agent --target ${{ matrix.target }}
      - name: Sign and notarize macOS CLI assets
        if: matrix.signed
        shell: bash
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          set -euo pipefail
          cli_dir="target/${{ matrix.target }}/release"
          notarize_dir="$RUNNER_TEMP/kxen-cli-notarize-${{ matrix.platform }}"
          mkdir -p "$notarize_dir"
          for cli_name in kxen kxen-agent; do
            cli_path="$cli_dir/$cli_name"
            if [[ ! -f "$cli_path" ]]; then
              printf '%s binary not found: %s\n' "$cli_name" "$cli_path"
              exit 1
            fi
            codesign --sign "$APPLE_SIGNING_IDENTITY" \
              --options runtime --timestamp \
              "$cli_path"
            codesign --verify --strict --verbose=2 "$cli_path"
            cp -p "$cli_path" "$notarize_dir/$cli_name"
          done
          cli_zip="$RUNNER_TEMP/kxen-notarize-${{ matrix.platform }}.zip"
          ditto -c -k --keepParent "$notarize_dir" "$cli_zip"
          xcrun notarytool submit "$cli_zip" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
      - name: Clear temporary signing material
        if: ${{ always() && matrix.signed }}
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/kxen-signing.keychain-db" 2>/dev/null || true
          for path in "$RUNNER_TEMP/kxen-certificate.p12" "$RUNNER_TEMP/app-store-connect.p8"; do
            if [[ -f "$path" ]]; then
              : > "$path"
              chmod 000 "$path"
            fi
          done
      - name: Prepare verified headless asset set
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: >-
          bash "$RUNNER_TEMP/trusted-release-tools/prepare-release-assets.sh"
          "${{ matrix.platform }}"
          "$RELEASE_TAG"
          "$GITHUB_REPOSITORY"
          -
          "$RUNNER_TEMP/release-assets"
          headless
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-headless-${{ matrix.platform }}-${{ needs.validate.outputs.tag }}
          path: ${{ runner.temp }}/release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish verified GitHub release
    needs:
      - validate
      - desktop
      - headless
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Preserve trusted release tools
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/trusted-release-tools"
          cp scripts/{github-release,prepare-release-assets,release-lib,release-manifest,validate-release,verify-macos-release,verify-release-assets}.sh \
            scripts/verify-updater-signature.mjs \
            "$RUNNER_TEMP/trusted-release-tools/"
          cp cliff.toml "$RUNNER_TEMP/trusted-release-tools/cliff.toml"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*-${{ needs.validate.outputs.tag }}
          path: ${{ runner.temp }}/release-assets
          merge-multiple: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Revalidate tag immediately before publishing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: bash "$RUNNER_TEMP/trusted-release-tools/validate-release.sh" "$RELEASE_TAG" origin/main "$GITHUB_REPOSITORY" "$GITHUB_SHA"
      - name: Generate version-specific release notes
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          version: v2.13.1
          config: ${{ runner.temp }}/trusted-release-tools/cliff.toml
          args: --current --strip header --output ${{ runner.temp }}/release-notes.md
      - name: Merge updater manifest and checksums
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/trusted-release-tools/release-lib.sh"
          kxen_validate_release_notes_file "$RELEASE_TAG" "$RUNNER_TEMP/release-notes.md"
          release_notes="$(cat "$RUNNER_TEMP/release-notes.md")"
          kxen_merge_updater_manifest \
            "${RELEASE_TAG#v}" "$GITHUB_REPOSITORY" "$RELEASE_TAG" \
            "$RUNNER_TEMP/release-assets" "$RUNNER_TEMP/release-assets/latest.json" \
            "$release_notes"
          kxen_write_sha256sums "$RUNNER_TEMP/release-assets"
      - name: Verify downloaded release assets
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: bash "$RUNNER_TEMP/trusted-release-tools/verify-release-assets.sh" "$RELEASE_TAG" "$GITHUB_REPOSITORY" "$RUNNER_TEMP/release-assets"
      - name: Create draft release from verified assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
        run: >-
          bash "$RUNNER_TEMP/trusted-release-tools/github-release.sh"
          create-draft "$RELEASE_TAG" "$GITHUB_REPOSITORY" "$RELEASE_COMMIT" "$RUNNER_TEMP/release-assets" "$RUNNER_TEMP/release-notes.md"
      - name: Verify draft release asset set
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
        run: >-
          bash "$RUNNER_TEMP/trusted-release-tools/github-release.sh"
          verify-draft "$RELEASE_TAG" "$GITHUB_REPOSITORY" "$RELEASE_COMMIT" "$RUNNER_TEMP/release-assets"
      - name: Publish verified release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
        run: >-
          bash "$RUNNER_TEMP/trusted-release-tools/github-release.sh"
          publish "$RELEASE_TAG" "$GITHUB_REPOSITORY" "$RELEASE_COMMIT" "$RUNNER_TEMP/release-assets"
      - name: Clean up incomplete draft after failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
        run: >-
          bash "$RUNNER_TEMP/trusted-release-tools/github-release.sh"
          cleanup-draft "$RELEASE_TAG" "$GITHUB_REPOSITORY" "$RELEASE_COMMIT" "$RUNNER_TEMP/release-assets"

  docker:
    name: Publish release GHCR image
    needs:
      - validate
      - publish
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker.yml
    with:
      tag: ${{ needs.validate.outputs.tag }}
