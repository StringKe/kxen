---
name: Kxen Issue Autofix

on:
  issues:
    types:
      - labeled
  workflow_dispatch:
    inputs:
      issue_number:
        description: Existing bug issue carrying the kxen:fix label
        required: true
        type: number

permissions: {}

concurrency:
  group: kxen-issue-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  gate:
    name: Authorize issue request
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.action == 'labeled' && github.event.label.name == 'kxen:fix')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    outputs:
      issue: ${{ steps.metadata.outputs.issue }}
      base: ${{ steps.metadata.outputs.base }}
      branch: ${{ steps.metadata.outputs.branch }}
    steps:
      - name: Resolve actor, labels, and repository metadata
        id: metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
        run: |
          set -euo pipefail
          permission="$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$GITHUB_ACTOR/permission" --jq '.permission')"
          case "$permission" in
            admin | maintain | write) ;;
            *)
              printf 'actor %s does not have write permission\n' "$GITHUB_ACTOR"
              exit 1
              ;;
          esac
          labels="$(gh issue view "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --json labels --jq '[.labels[].name]')"
          jq -e 'index("bug") != null and index("kxen:fix") != null' <<< "$labels" >/dev/null
          base="$(gh repo view "$GITHUB_REPOSITORY" --json defaultBranchRef --jq '.defaultBranchRef.name')"
          {
            printf 'issue=%s\n' "$ISSUE_NUMBER"
            printf 'base=%s\n' "$base"
            printf 'branch=kxen-agent/issue-%s\n' "$ISSUE_NUMBER"
          } >> "$GITHUB_OUTPUT"

  context:
    name: Verify GitHub Issue context
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: ubuntu:24.04@sha256:561618e2c15bf2397621dd04f96926663a3b5616c189cf7e38db7e82f5c538ea
      options: --security-opt no-new-privileges:true --cap-drop=SYS_PTRACE
    environment: agent-automation
    permissions:
      contents: read
      issues: read
    env:
      KXEN_AGENT_VERSION: ${{ vars.KXEN_AGENT_VERSION }}
      XAI_MODEL: ${{ vars.XAI_MODEL }}
    steps:
      - name: Bootstrap isolated context worker
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl gh git jq xz-utils

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.gate.outputs.base }}
          persist-credentials: false

      - name: Install verified kxen-agent release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$KXEN_AGENT_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          agent_dir="$RUNNER_TEMP/kxen-agent-bin"
          mkdir -p "$agent_dir"
          gh release download "$KXEN_AGENT_VERSION" \
            --repo StringKe/kxen \
            --pattern kxen-agent-linux-x86_64.tar.gz \
            --pattern SHA256SUMS \
            --dir "$agent_dir"
          (
            cd "$agent_dir"
            grep ' kxen-agent-linux-x86_64.tar.gz$' SHA256SUMS | sha256sum -c -
            tar -xzf kxen-agent-linux-x86_64.tar.gz
            chmod 0755 kxen-agent
          )
          printf '%s\n' "$agent_dir" >> "$GITHUB_PATH"

      - name: Prepare least-privilege runtime
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          [[ "$XAI_MODEL" =~ ^[A-Za-z0-9._:/-]+$ ]]
          root="$RUNNER_TEMP/kxen-agent-context-runtime"
          workspace="$RUNNER_TEMP/kxen-github-context"
          state="$RUNNER_TEMP/kxen-agent-context-state"
          handoff="$RUNNER_TEMP/kxen-context-handoff"
          mkdir -p "$root" "$workspace" "$state" "$handoff"
          {
            printf '[roles.planning]\nprovider = "xai"\nmodel = "%s"\n\n' "$XAI_MODEL"
            printf '[limits]\nglobal_concurrent = 1\ndaily_token_budget = 80000\n\n'
            printf '[limits.providers.xai]\nconcurrent = 1\nrpm = 10\n'
            printf 'input_usd_per_million = 2.0\noutput_usd_per_million = 6.0\n'
            printf 'daily_cost_budget_usd = 1.0\ncircuit_failure_threshold = 2\ncircuit_cooldown_seconds = 60\n'
          } > "$root/config.toml"
          chmod 0600 "$root/config.toml"
          {
            printf 'root=%s\n' "$root"
            printf 'workspace=%s\n' "$workspace"
            printf 'state=%s\n' "$state"
            printf 'handoff=%s\n' "$handoff"
          } >> "$GITHUB_OUTPUT"

      - name: Read bounded Issue input outside the model runtime
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HANDOFF: ${{ steps.runtime.outputs.handoff }}
          ISSUE_NUMBER: ${{ needs.gate.outputs.issue }}
        run: |
          set -euo pipefail
          gh issue view "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --json number,title,body,state,url,author,labels \
            | jq \
                --arg repository "$GITHUB_REPOSITORY" \
                '{
                  source: "github-issue",
                  repository: $repository,
                  issue: {
                    number,
                    title,
                    body,
                    state,
                    url,
                    author: .author.login,
                    labels: [.labels[].name]
                  }
                }' \
              > "$HANDOFF/issue-task.json"
          chmod 0600 "$HANDOFF/issue-task.json"

      - name: Materialize one-shot Provider credential
        shell: bash
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          set -euo pipefail
          [[ -n "$XAI_API_KEY" ]]
          umask 077
          jq -n '{xai:{type:"api",key:env.XAI_API_KEY}}' \
            > "$RUNNER_TEMP/kxen-agent-context-auth.json"
          chmod 0600 "$RUNNER_TEMP/kxen-agent-context-auth.json"

      - name: Run context verifier
        shell: bash
        env:
          HANDOFF: ${{ steps.runtime.outputs.handoff }}
          ISSUE_NUMBER: ${{ needs.gate.outputs.issue }}
          RUNTIME_ROOT: ${{ steps.runtime.outputs.root }}
          STATE_DIR: ${{ steps.runtime.outputs.state }}
          WORKSPACE: ${{ steps.runtime.outputs.workspace }}
        run: |
          set -euo pipefail
          kxen-agent run \
            --workspace "$WORKSPACE" \
            --agent examples/kxen-agent/github-issue/context.dcpagent.yaml \
            --policy examples/kxen-agent/github-issue/context.policy.json \
            --config "$RUNTIME_ROOT/config.toml" \
            --auth-file "$RUNNER_TEMP/kxen-agent-context-auth.json" \
            --consume-auth-file \
            --state-dir "$STATE_DIR" \
            --task-file "$HANDOFF/issue-task.json" \
            --format jsonl \
            | tee "$HANDOFF/context.jsonl"
          bash scripts/kxen-agent-issue-workflow.sh extract-result "$HANDOFF/context.jsonl" "$HANDOFF/context.json"
          bash scripts/kxen-agent-issue-workflow.sh validate-result context "$HANDOFF/context.json"
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --argjson issue "$ISSUE_NUMBER" \
            '(.issue.owner + "/" + .issue.repo) == $repository and .issue.number == $issue' \
            "$HANDOFF/context.json" >/dev/null

      - name: Remove unconsumed Provider credential
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          credential="$RUNNER_TEMP/kxen-agent-context-auth.json"
          if [[ -f "$credential" ]]; then
            chmod 0600 "$credential"
            shred -u "$credential"
          fi

      - name: Preserve context and recovery evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kxen-agent-context-${{ github.run_id }}
          path: |
            ${{ steps.runtime.outputs.handoff }}
            ${{ steps.runtime.outputs.state }}
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  fixer:
    name: Implement and verify candidate fix
    needs:
      - gate
      - context
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: ubuntu:24.04@sha256:561618e2c15bf2397621dd04f96926663a3b5616c189cf7e38db7e82f5c538ea
      options: --security-opt no-new-privileges:true --cap-drop=SYS_PTRACE
    environment: agent-automation
    permissions:
      contents: read
    env:
      KXEN_AGENT_VERSION: ${{ vars.KXEN_AGENT_VERSION }}
      XAI_MODEL: ${{ vars.XAI_MODEL }}
    steps:
      - name: Bootstrap isolated repository worker
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl gh git jq libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev pkg-config xz-utils

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.gate.outputs.base }}
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          components: clippy,rustfmt
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.15.1
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Freeze trusted definitions and prepare issue branch
        id: trusted
        shell: bash
        env:
          BASE_BRANCH: ${{ needs.gate.outputs.base }}
          GH_TOKEN: ${{ github.token }}
          ISSUE_BRANCH: ${{ needs.gate.outputs.branch }}
        run: |
          set -euo pipefail
          trusted="$RUNNER_TEMP/kxen-agent-trusted"
          mkdir -p "$trusted/github-issue"
          cp scripts/kxen-agent-issue-workflow.sh "$trusted/issue-workflow.sh"
          cp examples/kxen-agent/github-issue/* "$trusted/github-issue/"
          chmod 0755 "$trusted/issue-workflow.sh"
          bash "$trusted/issue-workflow.sh" prepare-branch \
            "$ISSUE_BRANCH" \
            "$BASE_BRANCH"
          if ! git diff --quiet "origin/$BASE_BRANCH" HEAD --; then
            bash "$trusted/issue-workflow.sh" validate-diff "origin/$BASE_BRANCH"
          fi
          parent="$(git rev-parse HEAD)"
          printf '%s\n' "$parent" > "$RUNNER_TEMP/kxen-candidate-parent"
          {
            printf 'root=%s\n' "$trusted"
            printf 'parent=%s\n' "$parent"
          } >> "$GITHUB_OUTPUT"

      - name: Install verified kxen-agent release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$KXEN_AGENT_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          agent_dir="$RUNNER_TEMP/kxen-agent-bin"
          mkdir -p "$agent_dir"
          gh release download "$KXEN_AGENT_VERSION" \
            --repo StringKe/kxen \
            --pattern kxen-agent-linux-x86_64.tar.gz \
            --pattern SHA256SUMS \
            --dir "$agent_dir"
          (
            cd "$agent_dir"
            grep ' kxen-agent-linux-x86_64.tar.gz$' SHA256SUMS | sha256sum -c -
            tar -xzf kxen-agent-linux-x86_64.tar.gz
            chmod 0755 kxen-agent
          )
          printf '%s\n' "$agent_dir" >> "$GITHUB_PATH"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kxen-agent-context-${{ github.run_id }}
          path: ${{ runner.temp }}/kxen-context-artifact

      - name: Prepare fixer runtime
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          [[ "$XAI_MODEL" =~ ^[A-Za-z0-9._:/-]+$ ]]
          root="$RUNNER_TEMP/kxen-agent-fixer-runtime"
          state="$RUNNER_TEMP/kxen-agent-fixer-state"
          handoff="$RUNNER_TEMP/kxen-fixer-handoff"
          mkdir -p "$root" "$state" "$handoff"
          {
            printf '[roles.execution]\nprovider = "xai"\nmodel = "%s"\n\n' "$XAI_MODEL"
            printf '[limits]\nglobal_concurrent = 1\ndaily_token_budget = 140000\n\n'
            printf '[limits.providers.xai]\nconcurrent = 1\nrpm = 10\n'
            printf 'input_usd_per_million = 2.0\noutput_usd_per_million = 6.0\n'
            printf 'daily_cost_budget_usd = 2.0\ncircuit_failure_threshold = 2\ncircuit_cooldown_seconds = 60\n'
          } > "$root/config.toml"
          chmod 0600 "$root/config.toml"
          cp "$RUNNER_TEMP/kxen-context-artifact/kxen-context-handoff/context.json" "$handoff/context.json"
          {
            printf 'root=%s\n' "$root"
            printf 'state=%s\n' "$state"
            printf 'handoff=%s\n' "$handoff"
          } >> "$GITHUB_OUTPUT"

      - name: Materialize one-shot Provider credential
        shell: bash
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          set -euo pipefail
          [[ -n "$XAI_API_KEY" ]]
          umask 077
          jq -n '{xai:{type:"api",key:env.XAI_API_KEY}}' \
            > "$RUNNER_TEMP/kxen-agent-fixer-auth.json"
          chmod 0600 "$RUNNER_TEMP/kxen-agent-fixer-auth.json"

      - name: Run repository fixer
        shell: bash
        env:
          HANDOFF: ${{ steps.runtime.outputs.handoff }}
          RUNTIME_ROOT: ${{ steps.runtime.outputs.root }}
          STATE_DIR: ${{ steps.runtime.outputs.state }}
          TRUSTED_ROOT: ${{ steps.trusted.outputs.root }}
        run: |
          set -euo pipefail
          kxen-agent run \
            --workspace "$GITHUB_WORKSPACE" \
            --agent "$TRUSTED_ROOT/github-issue/fixer.dcpagent.yaml" \
            --policy "$TRUSTED_ROOT/github-issue/fixer.policy.json" \
            --config "$RUNTIME_ROOT/config.toml" \
            --auth-file "$RUNNER_TEMP/kxen-agent-fixer-auth.json" \
            --consume-auth-file \
            --state-dir "$STATE_DIR" \
            --task-file "$HANDOFF/context.json" \
            --format jsonl \
            | tee "$HANDOFF/fixer.jsonl"

      - name: Remove unconsumed Provider credential
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          credential="$RUNNER_TEMP/kxen-agent-fixer-auth.json"
          if [[ -f "$credential" ]]; then
            chmod 0600 "$credential"
            shred -u "$credential"
          fi

      - name: Validate and export candidate patch
        shell: bash
        env:
          BASE_BRANCH: ${{ needs.gate.outputs.base }}
          EXPECTED_PARENT: ${{ steps.trusted.outputs.parent }}
          HANDOFF: ${{ steps.runtime.outputs.handoff }}
          PATH: /usr/local/bin:/usr/bin:/bin
          TRUSTED_ROOT: ${{ steps.trusted.outputs.root }}
        run: |
          set -euo pipefail
          helper="$TRUSTED_ROOT/issue-workflow.sh"
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_PARENT" ]]
          bash "$helper" extract-result "$HANDOFF/fixer.jsonl" "$HANDOFF/fixer.json"
          bash "$helper" validate-result fixer "$HANDOFF/fixer.json"
          bash "$helper" validate-diff "origin/$BASE_BRANCH"
          bash "$helper" export-patch HEAD "$HANDOFF/candidate.patch"
          printf '%s\n' "$EXPECTED_PARENT" > "$HANDOFF/candidate-parent"

      - name: Preserve candidate and recovery evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kxen-agent-candidate-${{ github.run_id }}
          path: |
            ${{ steps.runtime.outputs.handoff }}
            ${{ steps.runtime.outputs.state }}
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  reviewer:
    name: Independently review candidate fix
    needs:
      - gate
      - fixer
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    container:
      image: ubuntu:24.04@sha256:561618e2c15bf2397621dd04f96926663a3b5616c189cf7e38db7e82f5c538ea
      options: --security-opt no-new-privileges:true --cap-drop=SYS_PTRACE
    environment: agent-automation
    permissions:
      contents: read
    env:
      KXEN_AGENT_VERSION: ${{ vars.KXEN_AGENT_VERSION }}
      XAI_MODEL: ${{ vars.XAI_MODEL }}
    steps:
      - name: Bootstrap isolated review worker
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl gh git jq libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev pkg-config xz-utils

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.gate.outputs.base }}
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          components: clippy,rustfmt
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.15.1
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Freeze trusted reviewer definition
        id: trusted
        shell: bash
        run: |
          set -euo pipefail
          trusted="$RUNNER_TEMP/kxen-agent-trusted"
          mkdir -p "$trusted/github-issue"
          cp scripts/kxen-agent-issue-workflow.sh "$trusted/issue-workflow.sh"
          cp examples/kxen-agent/github-issue/reviewer.* "$trusted/github-issue/"
          chmod 0755 "$trusted/issue-workflow.sh"
          printf 'root=%s\n' "$trusted" >> "$GITHUB_OUTPUT"

      - name: Install verified kxen-agent release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$KXEN_AGENT_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          agent_dir="$RUNNER_TEMP/kxen-agent-bin"
          mkdir -p "$agent_dir"
          gh release download "$KXEN_AGENT_VERSION" \
            --repo StringKe/kxen \
            --pattern kxen-agent-linux-x86_64.tar.gz \
            --pattern SHA256SUMS \
            --dir "$agent_dir"
          (
            cd "$agent_dir"
            grep ' kxen-agent-linux-x86_64.tar.gz$' SHA256SUMS | sha256sum -c -
            tar -xzf kxen-agent-linux-x86_64.tar.gz
            chmod 0755 kxen-agent
          )
          printf '%s\n' "$agent_dir" >> "$GITHUB_PATH"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kxen-agent-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/kxen-candidate-artifact

      - name: Prepare isolated reviewer Workspace
        id: runtime
        shell: bash
        env:
          BASE_BRANCH: ${{ needs.gate.outputs.base }}
          TRUSTED_ROOT: ${{ steps.trusted.outputs.root }}
        run: |
          set -euo pipefail
          [[ "$XAI_MODEL" =~ ^[A-Za-z0-9._:/-]+$ ]]
          helper="$TRUSTED_ROOT/issue-workflow.sh"
          candidate="$RUNNER_TEMP/kxen-candidate-artifact/kxen-fixer-handoff"
          bash "$helper" apply-patch "$candidate/candidate.patch"
          bash "$helper" validate-diff "origin/$BASE_BRANCH"
          root="$RUNNER_TEMP/kxen-agent-reviewer-runtime"
          state="$RUNNER_TEMP/kxen-agent-reviewer-state"
          handoff="$RUNNER_TEMP/kxen-reviewer-handoff"
          mkdir -p "$root" "$state" "$handoff"
          {
            printf '[roles.review]\nprovider = "xai"\nmodel = "%s"\n\n' "$XAI_MODEL"
            printf '[limits]\nglobal_concurrent = 1\ndaily_token_budget = 100000\n\n'
            printf '[limits.providers.xai]\nconcurrent = 1\nrpm = 10\n'
            printf 'input_usd_per_million = 2.0\noutput_usd_per_million = 6.0\n'
            printf 'daily_cost_budget_usd = 1.5\ncircuit_failure_threshold = 2\ncircuit_cooldown_seconds = 60\n'
          } > "$root/config.toml"
          chmod 0600 "$root/config.toml"
          jq -n \
            --slurpfile issue "$candidate/context.json" \
            --slurpfile fixer "$candidate/fixer.json" \
            '{issueContext:$issue[0], fixerClaim:$fixer[0]}' \
            > "$handoff/reviewer-task.json"
          fingerprint="$(bash "$helper" source-fingerprint)"
          {
            printf 'root=%s\n' "$root"
            printf 'state=%s\n' "$state"
            printf 'handoff=%s\n' "$handoff"
            printf 'fingerprint=%s\n' "$fingerprint"
          } >> "$GITHUB_OUTPUT"

      - name: Materialize one-shot Provider credential
        shell: bash
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          set -euo pipefail
          [[ -n "$XAI_API_KEY" ]]
          umask 077
          jq -n '{xai:{type:"api",key:env.XAI_API_KEY}}' \
            > "$RUNNER_TEMP/kxen-agent-reviewer-auth.json"
          chmod 0600 "$RUNNER_TEMP/kxen-agent-reviewer-auth.json"

      - name: Run independent reviewer
        shell: bash
        env:
          HANDOFF: ${{ steps.runtime.outputs.handoff }}
          RUNTIME_ROOT: ${{ steps.runtime.outputs.root }}
          STATE_DIR: ${{ steps.runtime.outputs.state }}
          TRUSTED_ROOT: ${{ steps.trusted.outputs.root }}
        run: |
          set -euo pipefail
          kxen-agent run \
            --workspace "$GITHUB_WORKSPACE" \
            --agent "$TRUSTED_ROOT/github-issue/reviewer.dcpagent.yaml" \
            --policy "$TRUSTED_ROOT/github-issue/reviewer.policy.json" \
            --config "$RUNTIME_ROOT/config.toml" \
            --auth-file "$RUNNER_TEMP/kxen-agent-reviewer-auth.json" \
            --consume-auth-file \
            --state-dir "$STATE_DIR" \
            --task-file "$HANDOFF/reviewer-task.json" \
            --format jsonl \
            | tee "$HANDOFF/reviewer.jsonl"

      - name: Remove unconsumed Provider credential
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          credential="$RUNNER_TEMP/kxen-agent-reviewer-auth.json"
          if [[ -f "$credential" ]]; then
            chmod 0600 "$credential"
            shred -u "$credential"
          fi

      - name: Validate independent review
        shell: bash
        env:
          EXPECTED_FINGERPRINT: ${{ steps.runtime.outputs.fingerprint }}
          HANDOFF: ${{ steps.runtime.outputs.handoff }}
          PATH: /usr/local/bin:/usr/bin:/bin
          TRUSTED_ROOT: ${{ steps.trusted.outputs.root }}
        run: |
          set -euo pipefail
          helper="$TRUSTED_ROOT/issue-workflow.sh"
          bash "$helper" extract-result "$HANDOFF/reviewer.jsonl" "$HANDOFF/reviewer.json"
          bash "$helper" validate-result reviewer "$HANDOFF/reviewer.json"
          actual="$(bash "$helper" source-fingerprint)"
          [[ "$actual" == "$EXPECTED_FINGERPRINT" ]]

      - name: Preserve review and recovery evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kxen-agent-review-${{ github.run_id }}
          path: |
            ${{ steps.runtime.outputs.handoff }}
            ${{ steps.runtime.outputs.state }}
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  publish:
    name: Publish reviewed draft pull request
    needs:
      - gate
      - fixer
      - reviewer
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.gate.outputs.base }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kxen-agent-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/kxen-candidate-artifact

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kxen-agent-review-${{ github.run_id }}
          path: ${{ runner.temp }}/kxen-review-artifact

      - name: Reconstruct and publish from isolated trusted runner
        shell: bash
        env:
          BASE_BRANCH: ${{ needs.gate.outputs.base }}
          GH_TOKEN: ${{ github.token }}
          ISSUE_BRANCH: ${{ needs.gate.outputs.branch }}
          ISSUE_NUMBER: ${{ needs.gate.outputs.issue }}
          PATH: /usr/local/bin:/usr/bin:/bin
        run: |
          set -euo pipefail
          trusted="$RUNNER_TEMP/kxen-agent-publisher-trusted"
          mkdir -p "$trusted"
          cp "$GITHUB_WORKSPACE/scripts/kxen-agent-issue-workflow.sh" "$trusted/issue-workflow.sh"
          chmod 0755 "$trusted/issue-workflow.sh"
          helper="$trusted/issue-workflow.sh"
          candidate="$RUNNER_TEMP/kxen-candidate-artifact/kxen-fixer-handoff"
          review="$RUNNER_TEMP/kxen-review-artifact/kxen-reviewer-handoff"
          parent="$(< "$candidate/candidate-parent")"
          bash "$helper" prepare-publish-branch \
            "$ISSUE_BRANCH" \
            "$BASE_BRANCH" \
            "$parent"
          bash "$helper" apply-patch "$candidate/candidate.patch"
          bash "$helper" publish \
            "$ISSUE_NUMBER" \
            "$ISSUE_BRANCH" \
            "$BASE_BRANCH" \
            "$candidate/fixer.json" \
            "$review/reviewer.json"

  report-failure:
    name: Report failed automation run
    if: ${{ always() && needs.gate.result == 'success' && needs.publish.result != 'success' }}
    needs:
      - gate
      - context
      - fixer
      - reviewer
      - publish
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Comment with protected run evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ needs.gate.outputs.issue }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh issue comment "$ISSUE_NUMBER" \
            --repo "$REPOSITORY" \
            --body "kxen-agent did not publish a draft fix. Inspect the protected workflow run: $RUN_URL"
