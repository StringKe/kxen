---
name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:
    inputs:
      ref:
        description: Exact commit to validate for a release
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.15.1
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Test release validation helpers
        run: |
          bash -n scripts/github-release.sh scripts/kxen-agent-issue-workflow.sh scripts/kxen-agent-issue-workflow.test.sh \
            scripts/installers.test.sh website/public/install.sh \
            scripts/prepare-release-assets.sh scripts/release-lib.sh \
            scripts/release-lib.test.sh scripts/release-manifest.sh scripts/validate-release.sh \
            scripts/verify-macos-release.sh scripts/verify-release-assets.sh
          /bin/bash scripts/release-lib.test.sh
          /bin/bash scripts/kxen-agent-issue-workflow.test.sh
          /bin/bash scripts/installers.test.sh
          bash scripts/release-manifest.sh json | jq -e '.include | length == 6' > /dev/null
          node --check scripts/verify-updater-signature.mjs
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Install WebKit test browser
        run: pnpm exec playwright install --with-deps webkit
      - name: Check frontend format, lint, and types
        run: pnpm check
      - name: Run frontend tests with coverage gate
        run: pnpm coverage
      - name: Build frontend
        run: pnpm build
      - name: Audit frontend production dependencies
        run: pnpm audit --prod --audit-level high

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Test Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/installers.test.ps1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          components: clippy,rustfmt,llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: matrix.os == 'macos-14'
        with:
          key: ci-${{ matrix.os }}
      # tauri/webkit 系统依赖（tray-icon 需要 libayatana-appindicator）：仅 Linux
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      # coverage/audit 工具链安装慢，且门禁与锁文件审计与平台无关：只在 macOS 跑
      - name: Install pinned Rust gate tools
        if: matrix.os == 'macos-14'
        run: |
          cargo install --locked cargo-llvm-cov --version 0.8.7
          cargo install --locked cargo-audit --version 0.22.2
      # rust-embed 编译期读取仓库根 dist/（gitignored）：cargo 步骤前必须先构建前端产物
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.15.1
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Build frontend dist for rust-embed
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Check all Rust targets and features
        run: cargo check --workspace --all-targets --all-features
      - name: Run all Rust tests
        # Windows 暂不跑测试：lib 大量行为测试是 unix 语义（symlink/0600/kill 进程组），首跑基线待建
        if: runner.os != 'Windows'
        run: cargo test --workspace --all-targets --all-features
      - name: Validate GitHub Issue DCPAgent contracts
        if: runner.os == 'Linux'
        shell: bash
        run: |
          for role in context fixer reviewer; do
            cargo run -p kxen-agent -- agent validate \
              "examples/kxen-agent/github-issue/$role.dcpagent.yaml" \
              --policy "examples/kxen-agent/github-issue/$role.policy.json"
          done
      - name: Lint all Rust targets and features
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Enforce Rust coverage gate
        if: matrix.os == 'macos-14'
        run: bash scripts/rust-coverage.sh
      - name: Audit Rust dependencies
        if: matrix.os == 'macos-14'
        run: cargo audit --file Cargo.lock

  website:
    name: Website
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.15.1
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml
      - name: Install website dependencies
        run: pnpm install --frozen-lockfile
      - name: Check and build website
        run: pnpm check
      - name: Verify public installer endpoints
        run: |
          test -f dist/install.sh
          test -f dist/install.ps1
          test -f dist/install.sh.sha256
          test -f dist/install.ps1.sha256
          cmp public/install.sh dist/install.sh
          cmp public/install.ps1 dist/install.ps1
          cmp public/install.sh.sha256 dist/install.sh.sha256
          cmp public/install.ps1.sha256 dist/install.ps1.sha256
          (cd public && sha256sum -c install.sh.sha256)
          (cd public && sha256sum -c install.ps1.sha256)
      - name: Audit website production dependencies
        run: pnpm audit --prod --audit-level high
