---
name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:
    inputs:
      ref:
        description: Exact commit to validate for a release
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.15.1
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Test release validation helpers
        run: |
          bash -n scripts/github-release.sh scripts/prepare-macos-release-assets.sh scripts/release-lib.sh \
            scripts/release-lib.test.sh scripts/validate-release.sh scripts/verify-macos-release.sh scripts/verify-release-assets.sh
          /bin/bash scripts/release-lib.test.sh
          node --check scripts/verify-updater-signature.mjs
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Install WebKit test browser
        run: pnpm exec playwright install --with-deps webkit
      - name: Check frontend format, lint, and types
        run: pnpm check
      - name: Run frontend tests with coverage gate
        run: pnpm coverage
      - name: Build frontend
        run: pnpm build
      - name: Audit frontend production dependencies
        run: pnpm audit --prod --audit-level high

  rust:
    name: Rust
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          components: clippy,rustfmt,llvm-tools-preview
      - name: Install pinned Rust gate tools
        run: |
          cargo install --locked cargo-llvm-cov --version 0.8.7
          cargo install --locked cargo-audit --version 0.22.2
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - name: Check all Rust targets and features
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets --all-features
      - name: Run all Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets --all-features
      - name: Lint all Rust targets and features
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
      - name: Enforce Rust coverage gate
        run: bash scripts/rust-coverage.sh
      - name: Audit Rust dependencies
        run: cargo audit --file src-tauri/Cargo.lock

  website:
    name: Website
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.15.1
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml
      - name: Install website dependencies
        run: pnpm install --frozen-lockfile
      - name: Check and build website
        run: pnpm check
      - name: Audit website production dependencies
        run: pnpm audit --prod --audit-level high
