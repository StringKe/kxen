[package]
name = "kxen-cli"
version = "0.1.2"
edition = "2024"
license = "MIT"
repository = "https://github.com/StringKe/kxen"
description = "kxen headless web server binary (no GUI): full app service over HTTP/WebSocket"

[[bin]]
name = "kxen"
path = "src/main.rs"

[dependencies]
kxen-core = { path = "../kxen-core" }
serde_json = "1"
tokio = { version = "1.53", features = [
  "macros",
  "rt-multi-thread",
  "signal",
  "time",
  "net",
  "io-util",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
futures = "0.3"
tokio-tungstenite = "0.30"
