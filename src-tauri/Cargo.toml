[package]
name = "kxen-app"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/StringKe/kxen"
description = "kxen - macOS Apple Silicon coding agent harness (Tauri + Rust)"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
tauri-plugin-websocket = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
similar = "2"
serde_json = "1"
tokio = { version = "1.53", features = [
  "rt-multi-thread",
  "macros",
  "fs",
  "process",
  "io-util",
  "time",
  "sync",
  "net",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "1"
thiserror = "2"
regex = "1.13"
ignore = "0.4"
globset = "0.4"
reqwest = { version = "0.13", default-features = false, features = [
  "rustls",
  "rustls-native-certs",
  "json",
  "stream",
  "multipart",
  "form",
  # websearch 的 query 参数编码（替手工 urlencode）
  "query",
] }
futures = "0.3"
tokio-tungstenite = "0.26"
keyring = "4"
dirs = "6"
base64 = "0.22"
time = { version = "0.3", features = ["parsing", "formatting"] }
rquickjs = { version = "0.12", features = ["futures"] }
cron = "0.12"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
objc2 = "0.6"
objc2-foundation = "0.3"
block2 = "0.6"
trash = "5"
cap-std = "4.0.2"
# browser 工具的 CDP 驱动（系统 Chrome headless）；default-features 只含 bytes（screencast 用），关掉求最小依赖树；
# fetcher 特性不启用：只驱动本机已装 Chrome，不下载 Chromium
chromiumoxide = { version = "0.9", default-features = false }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
tauri-plugin-dialog = "2.7.2"
notify-rust = "4"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[profile.release]
opt-level = 3
# PRD 3.6 全 LTO（fat）：codegen-units=1 已就位，thin 换 fat 换最后一段内联收益
lto = true
codegen-units = 1
strip = true
panic = "abort"
